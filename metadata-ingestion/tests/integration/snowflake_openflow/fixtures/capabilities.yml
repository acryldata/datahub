# Fixture recipe: capability sweep (M4).
# The verifier reads <out_dir>/ingestion-output.json, so the sink path is fixed.
source:
  type: snowflake-openflow
  config:
    connection:
      account_id: ${SNOWFLAKE_ACCOUNT}
      username: ${SNOWFLAKE_USER}
      private_key: ${SNOWFLAKE_PRIVATE_KEY}
      role: ${SNOWFLAKE_ROLE}
      warehouse: ${SNOWFLAKE_WAREHOUSE}
    env: PROD
    snowflake_env: PROD
    include_openflow_lineage: true
    include_run_history: false
    stateful_ingestion:
      enabled: true
      remove_stale_metadata: true
sink:
  type: file
  config:
    filename: .verify/M4-capabilities-complete/ingestion-output.json
