# Fixture recipe: connector -> Snowflake destination lineage (M3).
source:
  type: snowflake-openflow
  config:
    connection:
      account_id: ${SNOWFLAKE_ACCOUNT}
      username: ${SNOWFLAKE_USER}
      private_key: ${SNOWFLAKE_PRIVATE_KEY}
      role: ${SNOWFLAKE_ROLE}
      warehouse: ${SNOWFLAKE_WAREHOUSE}
    env: PROD
    snowflake_env: PROD
    include_openflow_lineage: true
    include_run_history: false
sink:
  type: file
  config:
    filename: .verify/M3-lineage/ingestion-output.json
